[project]
name = "eventflow"
version = "0.1.0"
description = "Batch data pipeline: multi-source log events -> S3/Parquet data lake -> PostgreSQL star schema"
requires-python = ">=3.10"

[tool.ruff]
line-length = 130

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
